name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Wineel.sln -p:Platform=x64
      - name: Build
        run: dotnet build Wineel.sln -c Release -p:Platform=x64 --no-restore
      - name: Test
        run: dotnet test Wineel.sln -c Release -p:Platform=x64 --no-build --no-restore
      - name: Publish portable package
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Wineel-win-x64-portable
          path: artifacts/Wineel-*-win-x64-portable.zip
          if-no-files-found: error
