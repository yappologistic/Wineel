name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate tag and resolve version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH; received $env:TAG_NAME"
          }
          $version = $env:TAG_NAME.Substring(1)
          [xml]$project = Get-Content src/Wineel.App/Wineel.App.csproj
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne $version) {
            throw "Tag version $version does not match project version $projectVersion"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_ARCHIVE=Wineel-$version-win-x64-portable.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        run: dotnet restore Wineel.sln -p:Platform=x64

      - name: Build
        run: dotnet build Wineel.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test Wineel.sln -c Release -p:Platform=x64 --no-build --no-restore

      - name: Publish portable package
        shell: pwsh
        run: ./scripts/publish.ps1 -Version $env:RELEASE_VERSION

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wineel-${{ env.RELEASE_VERSION }}-win-x64-portable
          path: artifacts/${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create $env:TAG_NAME "artifacts/$env:RELEASE_ARCHIVE" --verify-tag --title "Wineel $env:RELEASE_VERSION" --generate-notes
